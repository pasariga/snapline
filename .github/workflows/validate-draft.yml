name: Reverify original Windows release candidate
on:
  push:
    branches: [prepare-windows-draft]
permissions:
  actions: read
  contents: read

jobs:
  verify-original:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Snapline-Windows-x64
          run-id: '45564015702'
          github-token: ${{ github.token }}
          path: original

      - name: Verify bytes against the original draft asset digests and build commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '1.6.2-windows.1'
          $source = 'f7ee98d3f3f9c79cc965642a3bb077318b4f5b26'
          $portableName = "Snapline-$version-win-x64-Portable.exe"
          $sums = @{
            'SHA256SUMS.txt' = 'dd2e1784d9a5930eb3efd047ab14004811dda6d64a65f25a8f71dfb10121c2ba'
            "Snapline-$version-win-x64-Setup.exe" = '6c70dd2b562ad0222e48ea3b4c5b0136ef29caf779cda40e05cfd647dd110a18'
            $portableName = 'cae53306d1264d2183b68433ab771342999d80024d089cc6e9adbd4a0ab6d855'
          }

          function Assert-Package([string] $Root) {
            foreach ($file in $sums.Keys) {
              $match = @(Get-ChildItem -Path $Root -Filter $file -Recurse -File)
              if ($match.Count -ne 1) { throw "Package missing or ambiguous: $file" }
              $hash = (Get-FileHash -LiteralPath $match[0].FullName -Algorithm SHA256).Hash
              if ($hash -ne $sums[$file]) { throw "Draft digest mismatch: $file" }
              Write-Host "$file $($match[0].Length) bytes SHA256=$hash"
            }
            $portable = Get-ChildItem -Path $Root -Filter $portableName -Recurse -File
            $actual = $portable.VersionInfo.ProductVersion
            if ($actual -cne "$version+$source") { throw "Unexpected ProductVersion: $actual" }
            Write-Host "Embedded ProductVersion: $actual"
            $manifest = Get-ChildItem -Path $Root -Filter SHA256SUMS.txt -Recurse -File
            $entries = @(Get-Content -LiteralPath $manifest.FullName)
            if ($entries.Count -ne 2) { throw 'Expected two checksum entries.' }
            foreach ($line in $entries) {
              $hash, $name = $line -split '  ', 2
              if (!$sums.ContainsKey($name) -or $hash -ne $sums[$name]) {
                throw "Checksum manifest mismatch: $name"
              }
            }
          }
          Assert-Package 'original'
          $fromDraft = Join-Path $env:RUNNER_TEMP 'original-release-attachments'
          gh release download "v$version" --repo $env:GITHUB_REPOSITORY --dir $fromDraft
          if ($LASTEXITCODE -eq 0) {
            Assert-Package $fromDraft
            Write-Host 'Downloaded release attachments independently matched the build artifact.'
          } else {
            Write-Host 'Draft attachment access unavailable with read-only token. Compared build bytes against the independently recorded API digests.'
          }
