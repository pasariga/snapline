name: Windows packages

# CI produces candidate artifacts. A maintainer creates and publishes a release in GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build self-contained release packages
        shell: pwsh
        run: .\scripts\build.ps1 -Installer

      - name: Smoke test portable, installer, startup and uninstaller
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Snapline/Snapline.csproj -Raw)).Project.PropertyGroup.Version |
            Select-Object -First 1
          $packages = Join-Path $PWD "dist\release\$version"
          $portable = Join-Path $packages "Snapline-$version-win-x64-Portable.exe"
          $setup = Join-Path $packages "Snapline-$version-win-x64-Setup.exe"
          $testDir = Join-Path $env:RUNNER_TEMP 'Snapline Windows test'

          $entries = Get-Content -LiteralPath (Join-Path $packages 'SHA256SUMS.txt')
          if ($entries.Count -ne 2) { throw 'Expected two release checksums.' }
          foreach ($entry in $entries) {
            $hash, $asset = $entry -split '  ', 2
            if ((Get-FileHash -LiteralPath (Join-Path $packages $asset)).Hash -ne $hash) {
              throw "Checksum mismatch for $asset"
            }
          }

          # Use test data and a legacy startup marker on the disposable runner.
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (!(Test-Path -LiteralPath $runKey)) { New-Item -Path $runKey | Out-Null }
          $legacyCommand = '"C:\SnaplineLegacySmoke\Snapline.exe"'
          Set-ItemProperty -Path $runKey -Name 'Snapline' -Value $legacyCommand
          $savedCapture = Join-Path $env:RUNNER_TEMP 'snapline-saved-capture.png'
          Copy-Item 'docs/samples/document.png' -Destination $savedCapture
          $captureHash = (Get-FileHash -LiteralPath $savedCapture).Hash

          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup', ('/DIR="{0}"' -f $testDir)
          ) -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }

          $installed = Join-Path $testDir 'Snapline.exe'
          if ((Get-ItemPropertyValue -Path $runKey -Name 'SnaplineWindows') -ne ('"{0}"' -f $installed) -or
              (Get-ItemPropertyValue -Path $runKey -Name 'Snapline') -ne $legacyCommand) {
            throw 'Installer did not isolate the Windows edition startup entry.'
          }
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $portable).Hash) {
            throw 'The installed executable and portable executable differ.'
          }
          if (!(Test-Path (Join-Path $testDir 'LICENSE.txt')) -or !(Test-Path (Join-Path $testDir 'Manrope-OFL.txt'))) {
            throw 'Installed licenses are missing.'
          }

          # Hold the legacy shortcut while launching the candidate. Win32 hotkeys are system-wide.
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SmokeHotKey
          {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool RegisterHotKey(IntPtr hwnd, int id, uint modifiers, uint key);
              [DllImport("user32.dll")]
              public static extern bool UnregisterHotKey(IntPtr hwnd, int id);
          }
          '@
          if (![SmokeHotKey]::RegisterHotKey([IntPtr]::Zero, 1, 3, 0x54)) {
            throw 'Could not reserve the legacy Ctrl+Alt+T shortcut for the smoke test.'
          }

          try {
            foreach ($exe in $portable, $installed) {
              $env:SNAPLINE_TEST_PROFILE = 'SnaplineWindowsCi-' + [IO.Path]::GetFileNameWithoutExtension($exe)
              $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
              try {
                if ($process.WaitForExit(6000)) { throw "$exe exited early with $($process.ExitCode)" }
                $log = Join-Path $env:LOCALAPPDATA "$env:SNAPLINE_TEST_PROFILE\log.txt"
                if (!(Test-Path -LiteralPath $log) -or
                    !(Select-String -LiteralPath $log -SimpleMatch 'Watching ' -Quiet) -or
                    (Select-String -LiteralPath $log -SimpleMatch 'Could not start:', 'Could not register the shortcut' -Quiet)) {
                  throw 'Snapline reported a startup or hotkey registration failure.'
                }
              } finally {
                if (!$process.HasExited) { Stop-Process -Id $process.Id -ErrorAction Stop; $process.WaitForExit() }
              }
            }
          } finally {
            [SmokeHotKey]::UnregisterHotKey([IntPtr]::Zero, 1) | Out-Null
          }

          $uninstall = Start-Process -FilePath (Join-Path $testDir 'unins000.exe') -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -PassThru -Wait
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $installed)) {
            throw "Uninstall failed with code $($uninstall.ExitCode)"
          }
          if ((Get-ItemPropertyValue -Path $runKey -Name 'SnaplineWindows' -ErrorAction SilentlyContinue) -or
              (Get-ItemPropertyValue -Path $runKey -Name 'Snapline') -ne $legacyCommand -or
              (Get-FileHash -LiteralPath $savedCapture).Hash -ne $captureHash) {
            throw 'Uninstall failed to remove only its own startup entry or preserve the saved capture.'
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Snapline-Windows-x64
          path: |
            dist/release/*/*.exe
            dist/release/*/SHA256SUMS.txt
          if-no-files-found: error
